<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keen Bear — Clean text. No fuss.</title>
  <meta name="description" content="A free, dark-mode text cleaning utility. Paste dirty text in, pick a cleaner, get clean text out.">
  <meta property="og:title" content="Keen Bear">
  <meta property="og:description" content="Clean text. No fuss.">
  <meta property="og:image" content="keenbear.png">
  <meta property="og:type" content="website">
  <link rel="icon" href="keenbear.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <img src="keenbear.png" alt="Keen Bear mascot" class="header-mascot" width="40" height="40">
      <h1 class="header-title">Keen Bear</h1>
      <span class="header-tagline" id="tagline">Clean text. No fuss.</span>
    </div>
    <div class="header-controls">
      <select id="flavor-select" class="flavor-select" aria-label="Theme Flavor">
        <option value="hazmat">Hazmat</option>
        <option value="artisanal">Artisanal</option>
        <option value="butler">Butler</option>
        <option value="y2k">Y2K</option>
      </select>
      <button id="theme-toggle" class="btn btn-icon" title="Toggle light/dark mode" aria-label="Toggle theme">
        <span class="theme-icon-dark">☀️</span>
        <span class="theme-icon-light">🌙</span>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <button id="btn-paste" class="btn" title="Paste from clipboard">Paste</button>
    <button id="btn-copy" class="btn" title="Copy all text">Copy All</button>
    <button id="btn-clear" class="btn" title="Clear text">Clear</button>
    <div class="toolbar-separator"></div>
    <button id="btn-undo" class="btn" title="Undo (⌘Z)" disabled>Undo</button>
    <button id="btn-redo" class="btn" title="Redo (⌘⇧Z)" disabled>Redo</button>
    <div class="toolbar-separator"></div>
    <button id="btn-invisibles" class="btn" title="Show invisible characters">¶</button>
  </div>

  <div id="find-replace-panel" class="find-replace-panel" hidden>
    <div class="find-replace-row">
      <label class="find-replace-label">Find:</label>
      <input type="text" id="find-input" class="find-replace-input" placeholder="Search…" aria-label="Find">
      <label class="find-replace-toggle"><input type="checkbox" id="find-regex"> Regex</label>
      <label class="find-replace-toggle"><input type="checkbox" id="find-case" checked> Match Case</label>
    </div>
    <div class="find-replace-row">
      <label class="find-replace-label">Replace:</label>
      <input type="text" id="replace-input" class="find-replace-input" placeholder="Replace with…" aria-label="Replace">
      <span id="find-match-count" class="find-match-count">0 matches</span>
      <button id="btn-replace-all" class="btn btn-sm">Replace All</button>
      <button id="btn-find-close" class="btn btn-sm btn-icon" aria-label="Close find panel">✕</button>
    </div>
    <div id="find-error" class="find-error" hidden></div>
  </div>

  <main class="main">
    <div class="editor-panel">
      <div class="editor-wrapper">
        <textarea id="text-area" class="text-area" placeholder="Paste or type your text here..." spellcheck="false" autofocus></textarea>
        <div id="invisibles-overlay" class="invisibles-overlay" aria-hidden="true"></div>
      </div>
    </div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Cleaners</h2>
      </div>
      <div class="filter-bar">
        <input type="text" id="filter-input" class="filter-input" placeholder="Filter cleaners… (⌘K)" aria-label="Filter cleaners">
      </div>
      <ul id="cleaner-list" class="cleaner-list"></ul>
    </aside>
  </main>

  <!-- Mobile: floating button to open cleaner drawer -->
  <button id="btn-mobile-cleaners" class="mobile-cleaners-btn" aria-label="Open cleaners">
    🧹
  </button>

  <!-- Mobile: bottom sheet backdrop -->
  <div id="mobile-backdrop" class="mobile-backdrop"></div>

  <footer class="status-bar">
    <div class="status-counts">
      <span id="status-chars">chars: 0</span>
      <span id="status-words">words: 0</span>
      <span id="status-lines">lines: 0</span>
    </div>
    <div class="status-credit">
      Built by <a href="https://adamtervort.com" target="_blank" rel="noopener">Adam Tervort</a>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
